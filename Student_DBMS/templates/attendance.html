{% extends 'base.html' %}
{% block content %}
<h3>Attendance for {{ today }}</h3>
<form method="POST">
    <table class="table bg-white">
        <thead><tr><th>Name</th><th>Status</th></tr></thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{s.name}} ({{s.roll_no}})</td>
                <td>
                    <input type="radio" name="status_{{s.id}}" value="Present" checked> Present
                    <input type="radio" name="status_{{s.id}}" value="Absent" class="ms-2"> Absent
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <button class="btn btn-primary">Save Attendance</button>
</form>
{% endblock %}
