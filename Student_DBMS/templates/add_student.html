{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 card p-4">
        <h3>Add Student</h3>
        <form method="POST">
            <input type="text" name="name" class="form-control mb-2" placeholder="Full Name" required>
            <input type="text" name="roll_no" class="form-control mb-2" placeholder="Roll No" required>
            <input type="text" name="course" class="form-control mb-2" placeholder="Course">
            <input type="number" step="0.1" name="marks" class="form-control mb-3" placeholder="Marks">
            <button class="btn btn-success w-100">Save Student</button>
        </form>
    </div>
</div>
{% endblock %}
